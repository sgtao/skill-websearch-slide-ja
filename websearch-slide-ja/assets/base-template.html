<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{タイトル} | Slides</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /*
     * ここに assets/styles/ の全 CSS を結合して統合する。
     * 統合するファイルと順序の正（SSoT）は SKILL.md の「参照ファイルガイド」
     * および Step 4 生成手順を参照する（print.css は必ず最後）。
     */
  </style>
</head>
<body>
  <!-- 右上コントロール（テーマ + ビュー切替 + エクスポート） -->
  <div class="control-cluster">
    <button id="theme-toggle" onclick="toggleTheme()" title="テーマ切替（クリック）">
      <span id="theme-icon">🌙</span>
    </button>
    <button id="view-toggle" onclick="toggleView()" title="表示切替（V）">☰</button>
    <!-- ▼ v0.6.0: カラーパレットメニュー -->
    <div class="palette-menu">
      <button id="palette-toggle" onclick="togglePaletteMenu()" title="カラーパレット">🎨</button>
      <div id="palette-dropdown" class="palette-dropdown" hidden role="menu">
        <button type="button" role="menuitem" data-palette-opt="ocean" class="is-active"
                onclick="setPalette('ocean'); closePaletteMenu();">
          <span class="palette-swatch swatch-ocean"></span>Ocean（既定）
        </button>
        <button type="button" role="menuitem" data-palette-opt="forest"
                onclick="setPalette('forest'); closePaletteMenu();">
          <span class="palette-swatch swatch-forest"></span>Forest
        </button>
        <button type="button" role="menuitem" data-palette-opt="sunset"
                onclick="setPalette('sunset'); closePaletteMenu();">
          <span class="palette-swatch swatch-sunset"></span>Sunset
        </button>
        <button type="button" role="menuitem" data-palette-opt="plum"
                onclick="setPalette('plum'); closePaletteMenu();">
          <span class="palette-swatch swatch-plum"></span>Plum
        </button>
        <button type="button" role="menuitem" data-palette-opt="graphite"
                onclick="setPalette('graphite'); closePaletteMenu();">
          <span class="palette-swatch swatch-graphite"></span>Graphite
        </button>
      </div>
    </div>
    <!-- ▼ Phase 3: エクスポートメニュー -->
    <div class="export-menu">
      <button id="export-toggle" onclick="toggleExportMenu()" title="エクスポート">📥</button>
      <div id="export-dropdown" class="export-dropdown" hidden role="menu">
        <button type="button" role="menuitem"
                onclick="exportPDF(); closeExportMenu();">
          📄 PDFとして印刷 <span class="kbd">P</span>
        </button>
        <button type="button" role="menuitem"
                onclick="exportSinglePNG(); closeExportMenu();">
          🖼️ このスライドをPNG <span class="kbd">Shift+S</span>
        </button>
        <button type="button" role="menuitem"
                onclick="exportAllPNG(); closeExportMenu();">
          📦 全スライドをZIP <span class="kbd">Shift+P</span>
        </button>
      </div>
    </div>
  </div>
  <!-- プログレスバー（最上部） -->
  <div id="progress-bar"></div>
  <!-- スケーラー（hero時: 16:9固定中央配置、list時: 縦並びスクロール） -->
  <div class="slide-scaler">
    <!-- ナビ矢印（hero時のみ表示） -->
    <button class="nav-arrow nav-prev" id="btn-prev" onclick="navigate(-1)">&#8249;</button>
    <button class="nav-arrow nav-next" id="btn-next" onclick="navigate(1)">&#8250;</button>
    <!-- ========== スライド本体（ここを各スライドで繰り返す） ========== -->
    <!--
      各スライドは <section class="slide"> で作成し、
      中身は必ず <div class="slide-inner"> で囲む（list時のスケーリングに必要）。
      最初のスライドのみ class="slide active" とする。
      data-num 属性は JS が自動で付与するので不要。
    -->
    <section class="slide active" id="s1">
      <div class="slide-inner">
        <!-- タイトルスライド例 -->
        <!-- references/slide-layouts.md の「タイトルスライド」を参照 -->
        <h1>{メインタイトル}</h1>
        <p class="subtitle">{サブタイトル}</p>
        <div class="badges">
          <span class="badge">GitHub ⭐</span>
          <span class="badge">X 🐦</span>
        </div>
      </div>
    </section>
    <section class="slide" id="s2">
      <div class="slide-inner">
        <!-- 2枚目以降のスライド -->
        <!-- references/slide-layouts.md の各レイアウトを参照 -->
      </div>
    </section>
    <!-- 以降、スライド枚数分 <section class="slide" id="sN"> を追加 -->
    <!-- スライド番号（hero時のみ表示） -->
    <div id="slide-counter">1 / N</div>
  </div><!-- /.slide-scaler -->
  <script>
    /*
     * ここに assets/scripts/ の全 JS を結合して統合する。
     * 統合するファイルと順序の正（SSoT）は SKILL.md の「参照ファイルガイド」
     * および Step 4 生成手順を参照する。
     * 注: export-pdf.js / export-png.js は CDN を動的ロードする。
     *     閲覧時は外部リソースなしで動作し、エクスポート操作時のみネット接続が必要。
     */
    // --- navigation.js の変数（他のJSから参照されるため先に宣言） ---
    const slides = document.querySelectorAll('.slide');
    const total  = slides.length;
    let cur = 0;
    // ここに統合したJSを貼り付ける
  </script>
</body>
</html>
